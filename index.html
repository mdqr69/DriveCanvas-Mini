<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <title>DriveCanvas</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
        }

        .status {
            color: #55d98b;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DriveCanvas</h1>

    <div class="card">

        <h2 id="welcome">Welcome</h2>

        <p>
            Telegram:
            <span class="status">Connected ✓</span>
        </p>

        <p>
            Vehicle:
            <span id="vehicleStatus">Not paired</span>
        </p>

        <button id="pairButton">
            Pair Vehicle
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById("welcome").textContent =
                "Hello, " + (user.first_name || "Driver");
        }

        const pairButton =
            document.getElementById("pairButton");

        const vehicleStatus =
            document.getElementById("vehicleStatus");

        pairButton.addEventListener("click", function () {

            if (!tg.showScanQrPopup) {
                tg.showAlert(
                    "QR scanning is not supported on this Telegram client."
                );
                return;
            }

            tg.showScanQrPopup(
                {
                    text: "Scan the DriveCanvas pairing QR shown on the car screen"
                },

                function (qrText) {

                    if (!qrText) {
                        return false;
                    }

                    tg.closeScanQrPopup();

                    vehicleStatus.textContent =
                        "QR scanned ✓";

                    tg.showAlert(
                        "DriveCanvas pairing code received:\n\n" +
                        qrText
                    );

                    return true;
                }
            );
        });
    </script>

</body>
</html>
